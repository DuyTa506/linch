name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The standard extras set the unit suite is validated against. Test-only
# dependencies such as jsonschema are declared directly in the dev extra;
# postgres/otel add adapters on top.
env:
  CORE_EXTRAS: "dev,mcp,anthropic,gemini"

jobs:
  quality:
    name: Lint, format, and types (3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No step pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${CORE_EXTRAS}]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pyright
        run: pyright

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${CORE_EXTRAS}]"

      - name: Run tests
        run: pytest -q --timeout=60 --timeout-method=thread

  all-extras:
    name: Tests with all extras (3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and all extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,anthropic,gemini,postgres,otel]"

      # Postgres tests self-skip without AGENT_KIT_TEST_PG_DSN; the extra just
      # exercises the adapter imports and the OpenTelemetry observer path.
      - name: Run tests
        run: pytest -q --timeout=60 --timeout-method=thread
