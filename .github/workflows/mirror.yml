# Keeps DuyTa506/linch-mirror identical to this repository (branches and tags).
# Needs the MIRROR_DEPLOY_KEY secret: the private half of a write deploy key on the mirror.
name: Mirror

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'Intramind-Labs/linch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to the mirror
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "$MIRROR_DEPLOY_KEY" ]; then echo "set the MIRROR_DEPLOY_KEY secret"; exit 1; fi
          install -m 600 /dev/null ~/mirror_key
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > ~/mirror_key
          export GIT_SSH_COMMAND="ssh -i $HOME/mirror_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
          git remote add mirror git@github.com:DuyTa506/linch-mirror.git
          git push mirror --force 'refs/remotes/origin/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
