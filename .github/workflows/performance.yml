name: Performance

# Record-only: runs the offline runtime benchmark and uploads the schema-v2 JSON
# as an artifact. It deliberately does NOT pass --check — GitHub-hosted runners
# are too noisy for absolute latency gates, so threshold enforcement stays local
# (scripts/benchmark_runtime.py --check). This workflow is for tracking trends.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      samples:
        description: "Measured samples per case"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  benchmark:
    name: Record runtime benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,anthropic,gemini]"

      - name: Run benchmark (record only)
        run: |
          python scripts/benchmark_runtime.py \
            --json \
            --samples "${{ github.event.inputs.samples || '20' }}" \
            > benchmark-runtime.json
          python scripts/benchmark_runtime.py --samples "${{ github.event.inputs.samples || '20' }}"

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-runtime-${{ github.run_id }}
          path: benchmark-runtime.json
          if-no-files-found: error
