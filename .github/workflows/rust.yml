# Format, lint, test and document the linch-rust workspace crates that do not
# need Python. linch-python is built and tested by native-wheels.yml.
name: Rust

on:
  pull_request:
    paths:
      - linch-rust/**
      - .github/workflows/rust.yml
  push:
    branches: [master]
    paths:
      - linch-rust/**

permissions:
  contents: read

defaults:
  run:
    working-directory: linch-rust

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linch-rust
      - run: cargo fmt --all --check
      - run: cargo clippy -p linch-core -p linch-providers -p linch-postgres -p linch-tools -p linch-mcp -p linch -p linch-rpc -p linch-server -p linch-worker --all-targets --locked -- -D warnings
      - run: cargo test -p linch-core -p linch-providers -p linch-postgres -p linch-tools -p linch-mcp -p linch -p linch-rpc -p linch-server -p linch-worker --locked
      - run: cargo doc -p linch-core -p linch-providers -p linch-postgres -p linch-tools -p linch-mcp -p linch -p linch-rpc -p linch-server -p linch-worker --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
