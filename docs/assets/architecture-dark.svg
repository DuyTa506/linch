<text x="215" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#eef2fa" font-family="system-ui, sans-serif">JSON-RPC</text>
<text x="215" y="222" text-anchor="middle" font-size="12" font-weight="400" fill="#9fb0cc" font-family="system-ui, sans-serif">stdio or socket</text>
<rect x="590" y="140" width="150" height="110" rx="10" fill="#131f33" stroke="#a9b6cf" stroke-width="1.5"/>
<text x="665" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#eef2fa" font-family="system-ui, sans-serif">Postgres</text>
<text x="665" y="203" text-anchor="middle" font-size="12" font-weight="400" fill="#9fb0cc" font-family="system-ui, sans-serif">durable event log</text>
<text x="665" y="224" text-anchor="middle" font-size="12" font-weight="400" fill="#9fb0cc" font-family="system-ui, sans-serif">leases, job queue</text>
