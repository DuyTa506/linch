<text x="665" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#eef2fa" font-family="system-ui, sans-serif">Provider APIs</text>
<text x="665" y="72" text-anchor="middle" font-size="12" font-weight="400" fill="#9fb0cc" font-family="system-ui, sans-serif">HTTP, streamed</text>
