<text x="395" y="404" text-anchor="middle" font-size="12" font-weight="400" fill="#9fb0cc" font-family="system-ui, sans-serif">local, sandbox, docker, remote</text>
<line x1="395" y1="320" x2="395" y2="351" stroke="#7f9bff" stroke-width="2"/>
<polygon points="395,360 390,351 400,351" fill="#7f9bff"/>
