<text x="395" y="292" text-anchor="middle" font-size="12" font-weight="400" fill="#9fb0cc" font-family="system-ui, sans-serif">schedules, background jobs</text>
<line x1="160" y1="195" x2="270" y2="195" stroke="#7f9bff" stroke-width="2"/>
