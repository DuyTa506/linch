<text x="395" y="190" text-anchor="middle" font-size="13" font-weight="400" fill="#eef2fa" font-family="system-ui, sans-serif">tools, hooks, MCP</text>
<rect x="295" y="206" width="200" height="26" rx="6" fill="#0b1424" stroke="#a9b6cf" stroke-opacity=".5"/>
<text x="395" y="224" text-anchor="middle" font-size="13" font-weight="400" fill="#eef2fa" font-family="system-ui, sans-serif">model providers</text>
<rect x="295" y="248" width="200" height="56" rx="6" fill="#0b1424" stroke="#a9b6cf" stroke-opacity=".5" stroke-dasharray="4 3"/>
