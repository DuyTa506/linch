<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img"><title>linch-rust architecture: Python app, linch-server, Postgres</title>
<rect x="10" y="140" width="150" height="110" rx="10" fill="#131f33" stroke="#a9b6cf" stroke-width="1.5"/>
<text x="85" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#eef2fa" font-family="system-ui, sans-serif">Your Python app</text>
<text x="85" y="203" text-anchor="middle" font-size="13" font-weight="400" fill="#9fb0cc" font-family="system-ui, sans-serif">linch_rust client</text>
<text x="85" y="226" text-anchor="middle" font-size="13" font-weight="400" fill="#9fb0cc" font-family="system-ui, sans-serif">host tools</text>
<rect x="270" y="70" width="250" height="250" rx="10" fill="#131f33" stroke="#a9b6cf" stroke-width="1.5"/>
<text x="395" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2fa" font-family="system-ui, sans-serif">linch-server</text>
<text x="395" y="122" text-anchor="middle" font-size="13" font-weight="400" fill="#9fb0cc" font-family="system-ui, sans-serif">Rust kernel</text>
<rect x="295" y="138" width="200" height="26" rx="6" fill="#0b1424" stroke="#a9b6cf" stroke-opacity=".5"/>
<text x="395" y="156" text-anchor="middle" font-size="13" font-weight="400" fill="#eef2fa" font-family="system-ui, sans-serif">agent loop</text>
