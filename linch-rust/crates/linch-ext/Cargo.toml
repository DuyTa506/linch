[package]
name = "linch-ext"
description = "Extensions on the Linch agent kernel: the eval harness and run reports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
futures = { version = "0.3.34", default-features = false, features = ["std"] }
linch-core = { path = "../linch-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Fresh session ids, so every eval case starts on an empty session.
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
