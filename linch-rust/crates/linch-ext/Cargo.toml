[package]
name = "linch-ext"
description = "Extensions on the Linch agent kernel: the eval harness, run reports, workflows and the deep agent preset."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# The durable workflow journal (PgJournalStore) and its migrations.
postgres = ["dep:sqlx"]

[dependencies]
# The JournalStore trait.
async-trait = "0.1.92"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
# The schema_valid scorer (already used by linch-core for tool schemas).
jsonschema = { version = "0.60.2", default-features = false }
linch-core = { path = "../linch-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# PgJournalStore; the same version and features as linch-postgres.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate"], optional = true }
thiserror = "2.0.21"
# Workflow step timeouts, retry backoff, the fan-out semaphore and the
# fan-out branch path (a task-local, under `rt`). Already in the tree
# through linch-core; no runtime is started here.
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
# The workflow cancel token, the same type as linch-core's RunOptions::cancel.
tokio-util = "0.7.20"
# Fresh session ids, so every eval case starts on an empty session.
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
# MemorySessions, for the file memory hook tests.
linch-tools = { path = "../linch-tools" }
# `connect`, for the PgJournalStore doc example: the bounded first connect
# hosts should use instead of sqlx's 30 s retry.
linch-postgres = { path = "../linch-postgres" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }

# Postgres tests: each skips without LINCH_TEST_PG_DSN.
[[test]]
name = "pg"
path = "tests/pg/main.rs"
required-features = ["postgres"]
