[package]
name = "linch-mcp"
description = "MCP client for the Linch agent kernel: server tools as registry tools."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
http = "1.4.0"
linch-core = { path = "../linch-core" }
rmcp = { version = "3.9.0", default-features = false, features = [
    "client",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7.20"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3.9.0", default-features = false, features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
