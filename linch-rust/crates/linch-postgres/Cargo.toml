[package]
name = "linch-postgres"
description = "Postgres run and session stores for the Linch agent kernel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
linch-core = { path = "../linch-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate"] }
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
