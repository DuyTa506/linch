[package]
name = "linch-providers"
description = "HTTP model provider adapters for the Linch agent kernel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
eventsource-stream = "0.2.3"
futures = "0.3.34"
linch-core = { path = "../linch-core" }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tokio-util = "0.7.20"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
