[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "linch-native"
description = "Native internals for the linch Python package"
requires-python = ">=3.11"
license = "MIT"
dynamic = ["version"]

[tool.maturin]
module-name = "_linch_native"
features = ["pyo3/extension-module"]
