[package]
name = "linch-rpc"
description = "JSON-RPC 2.0 protocol, server and client for the Linch agent kernel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
linch = { path = "../linch" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["codec", "rt"] }

[dev-dependencies]
# The `mcp_server` example serves linch-mcp's test server on stdio.
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt", "sync", "time"] }
