[package]
name = "linch-server"
description = "The Linch sidecar: serves the linch-rpc protocol over stdio, a Unix socket, or HTTP with WebSocket."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The HTTP server and WebSocket upgrade; already in the lockfile for
# linch-mcp's tests, `ws` adds tokio-tungstenite.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
futures = "0.3.34"
# Serves each HTTP connection with a deadline for its request head, which
# `axum::serve` cannot set (it gives hyper no timer); already in the
# lockfile through axum.
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server", "service", "tokio"] }
linch = { path = "../linch" }
linch-rpc = { path = "../linch-rpc" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-std", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Marks the process not dumpable, so a child cannot read its environment
# (the provider keys) from /proc; already in the lockfile.
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
serde_json = "1.0.154"
# Creates the Postgres test schema and counts its connections.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "time"] }
# The WebSocket client of the HTTP tests; the version axum's `ws` uses.
tokio-tungstenite = "0.29.0"
