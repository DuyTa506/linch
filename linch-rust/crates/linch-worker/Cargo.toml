[package]
name = "linch-worker"
description = "Postgres job queue, worker fleet and cron schedules for Linch runs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
croner = "4.0.3"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
linch-core = { path = "../linch-core" }
linch-postgres = { path = "../linch-postgres" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
