apiVersion: studio.linch.dev/v1alpha2
kind: LinchProject
metadata:
  name: preview
  title: preview
  description: ''
spec:
  package: preview
  target:
    python: '>=3.10'
    linch: '>=1.1,<2'
  runtime:
    provider:
      kind: null
      model: null
      apiKeyEnv: null
      baseUrlEnv: null
      projectEnv: null
      location: null
      contextWindow: null
      streaming: true
      thinking:
        enabled: false
        effort: null
        budgetTokens: null
      fallbackModels: []
    agent:
      preset: standard_agent
      instructions: ''
      maxTurns: 20
      budget:
        maxTokens: 100000
        maxCostUsd: null
        warnRatio: 0.9
      completion:
        mode: agent_judged
        maxRetries: 0
        verifiers: []
  tools:
  - id: tool
    displayName: tool
    description: 'TODO: describe this tool.'
    scope: read
    parallel: true
    retryable: false
    timeoutMs: null
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    resources: []
    kind: function
  subagents: []
  skills: []
  workflows: []
  routines: []
  triggers: []
  capabilities:
    prompt:
      mode: append
      text: ''
      sections: []
      customDynamicPolicy: false
    reliability:
      providerRetry:
        maxAttempts: 5
        baseDelayMs: 1000
        maxDelayMs: 30000
        jitter: 0.2
      toolTimeoutMs: null
      toolRetry: null
      maxOutputTokens: null
      maxToolConcurrency: null
      loopGuard:
        enabled: true
        maxIdenticalToolCalls: 3
        maxConsecutiveFailures: 3
        forceFinalAnswer: false
      truncationRecovery:
        enabled: false
        maxAttempts: 1
        feedback: null
      customTokenEstimator: false
      customRecoveryPolicy: false
    compaction:
      strategy: none
      keepRecentTurns: 10
      maxOutputTokens: 8192
      ladder:
        enabled: false
        micro: true
        keepRecentTurns: 10
        maxForcedCompactions: 3
        resetReadTracker: true
    structuredOutput:
      enabled: false
      name: result
      schema:
        type: object
        additionalProperties: true
      strict: true
      finalToolName: null
      repairRetries: 0
    context:
      memoryRecall: false
      maxTokens: null
      maxItems: 5
      customBuilder: false
      dynamicToolSelector: false
    memory:
      backend: none
      namespace: null
      dsnEnv: null
      searchTool: false
      upsertTool: false
      extractionHook: false
    filesystem:
      backend: none
      root: .linch/files
      offloadEnabled: false
      offloadThresholdTokens: null
      offloadThresholdFraction: 0.1
      previewLines: 10
    hooks:
      toolCache: false
      readBeforeWrite: true
      stopPredicateSkeleton: false
      customMiddleware: false
      redactionRules: []
    observation:
      logging: true
      runReport: true
      otel: false
      vendorExporter: null
    persistence:
      sessionStore: in_memory
      runStore: in_memory
      durableResume: false
    permissions:
      mode: interactive
      rules: []
      hitlCallbackSkeleton: false
      organizationPolicySkeleton: false
    extensions:
      mcpServers: []
      liveMcpDiscovery: false
      mailboxAdapter: none
      scheduleStoreAdapter: none
      isolationAdapter: none
    evals:
      enabled: false
      cases: []
      domainScorerSkeleton: false
    externalDatabase:
      enabled: false
      dsnEnv: null
      adapterTemplates: []
      vectorGuidance: []
