apiVersion: studio.linch.dev/v1alpha2
kind: LinchProject
metadata:
  name: goal_verified
  title: Goal verified
  description: A bounded root-only deterministic verification example.
spec:
  package: goal_verified
  runtime:
    provider:
      kind: openai_responses
      model: gpt-5
    agent:
      preset: standard_agent
      instructions: Finish the requested task and report DONE.
      maxTurns: 4
      budget:
        maxTokens: 10000
      completion:
        mode: verifier_gated
        maxRetries: 1
        verifiers:
          - kind: text_contains
            id: require_done
            text: DONE
            feedback: Finish the task and include DONE in the final answer.
