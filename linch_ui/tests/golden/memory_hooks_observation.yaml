apiVersion: studio.linch.dev/v1alpha1
kind: LinchProject
metadata:
  name: knowledge_assistant
  title: Knowledge Assistant
  description: Recall durable knowledge with context and observation hooks.
spec:
  package: knowledge_assistant
  provider:
    kind: openai_responses
    model: gpt-5
    apiKeyEnv: OPENAI_API_KEY
  primaryAgent:
    maxTurns: 8
    budget:
      maxTokens: 50000
  capabilities:
    prompt:
      text: Answer only from retrieved or explicitly supplied evidence.
      sections:
        - id: evidence_policy
          text: State when evidence is missing.
          placement: before_defaults
          cacheable: true
    compaction:
      strategy: detailed
      ladder:
        enabled: true
    context:
      memoryRecall: true
      maxTokens: 4000
      maxItems: 5
    memory:
      backend: sqlite
      namespace: knowledge
      searchTool: true
      upsertTool: true
    filesystem:
      backend: composite
      root: .linch/files.db
      offloadEnabled: true
      offloadThresholdTokens: 12000
    hooks:
      toolCache: true
      readBeforeWrite: true
      redactionRules:
        - pattern: '(?i)secret=[^ ]+'
          replacement: secret=[REDACTED]
    observation:
      logging: true
      runReport: true
      otel: true
    persistence:
      sessionStore: sqlite
      runStore: sqlite
      durableResume: true
