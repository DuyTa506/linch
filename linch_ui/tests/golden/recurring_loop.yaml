apiVersion: studio.linch.dev/v1alpha1
kind: LinchProject
metadata:
  name: nightly_review
  title: Nightly Review
  description: Review project health every morning.
spec:
  package: nightly_review
  provider:
    kind: openai_responses
    model: gpt-5
    apiKeyEnv: OPENAI_API_KEY
  primaryAgent:
    maxTurns: 6
    budget:
      maxTokens: 25000
  triggers:
    - kind: manual
      id: manual_review
      displayName: Manual Review
    - kind: cron
      id: daily_utc
      displayName: Daily UTC
      cron: 0 1 * * *
      timezone: UTC
  loops:
    - id: project_health
      displayName: Project Health
      charter: Keep the project healthy and actionable.
      prompt: Inspect the available project signals and produce one prioritized action.
      target: primary_agent
      triggers: [manual_review, daily_utc]
      maxTurns: 6
      budget:
        maxTokens: 25000
