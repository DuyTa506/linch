apiVersion: studio.linch.dev/v1alpha1
kind: LinchProject
metadata:
  name: parallel_review
  title: Parallel Review
  description: Fan out two reviews and fan them into one synthesis.
spec:
  package: parallel_review
  provider:
    kind: anthropic
    model: claude-sonnet-4-6
    apiKeyEnv: ANTHROPIC_API_KEY
  primaryAgent:
    maxTurns: 8
    budget:
      maxTokens: 80000
  workflows:
    - id: parallel_flow
      displayName: Parallel Review Flow
      output: synthesize
      maxConcurrency: 2
      nodes:
        - type: agent_call
          id: bugs
          label: Bugs
          prompt: Review for correctness bugs.
          phase: Review
        - type: agent_call
          id: performance
          label: Performance
          prompt: Review for performance risks.
          phase: Review
        - type: agent_call
          id: synthesize
          label: Synthesize
          prompt: Synthesize both predecessor reports.
          dependsOn: [bugs, performance]
          phase: Synthesize
