apiVersion: studio.linch.dev/v1alpha2
kind: LinchProject
metadata:
  name: workflow_routine
  title: Workflow routine
  description: A host-owned cron wrapper for a directed replayable workflow.
spec:
  package: workflow_routine
  runtime:
    provider:
      kind: openai_responses
      model: gpt-5
    agent:
      preset: standard_agent
      maxTurns: 4
      budget:
        maxTokens: 20000
  tools:
    - kind: function
      id: inspect_repo
      displayName: Inspect repository
      description: Read repository state without modifying it.
      scope: read
  subagents:
    - id: reviewer
      displayName: Reviewer
      instructions: Review the supplied repository evidence.
      tools:
        - inspect_repo
  workflows:
    - kind: directed
      id: review_flow
      displayName: Review flow
      nodes:
        - type: agent_call
          id: inspect
          label: Inspect
          prompt: Inspect the repository worktree.
          tools:
            - inspect_repo
        - type: agent_call
          id: report
          label: Report
          prompt: Review the inspection and report DONE when complete.
          dependsOn:
            - inspect
          subagent: reviewer
          tools:
            - inspect_repo
      output: report
  routines:
    - kind: workflow_run
      id: scheduled_review
      displayName: Scheduled review
      target: review_flow
      triggers:
        - every_two_hours
      maxTurns: 3
      budget:
        maxTokens: 12000
      doneWhen:
        kind: text_contains
        id: review_done
        text: DONE
  triggers:
    - kind: cron
      id: every_two_hours
      displayName: Every two hours
      cron: 0 */2 * * *
      timezone: Asia/Ho_Chi_Minh
  capabilities:
    persistence:
      sessionStore: sqlite
      runStore: sqlite
      durableResume: true
