apiVersion: studio.linch.dev/v1alpha2
kind: LinchProject
metadata:
  name: demo
  title: Demo
  description: A bounded offline-test blueprint.
spec:
  package: demo
  runtime:
    provider:
      kind: openai_responses
      model: gpt-5
      apiKeyEnv: OPENAI_API_KEY
    agent:
      preset: standard_agent
      instructions: Be concise.
      maxTurns: 8
      budget:
        maxTokens: 20000
      completion:
        mode: agent_judged
        maxRetries: 0
        verifiers: []
