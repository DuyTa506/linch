apiVersion: studio.linch.dev/v1alpha2
kind: LinchProject
metadata:
  name: pr_review
  title: PR Review
  description: Fan-out review.
spec:
  package: pr_review
  runtime:
    provider:
      kind: anthropic
      model: claude-sonnet-4-5
      apiKeyEnv: ANTHROPIC_API_KEY
    agent:
      preset: coordinator
      instructions: Delegate PR review to subagents.
      maxTurns: 12
      budget:
        maxTokens: 120000
      completion:
        mode: agent_judged
        maxRetries: 0
        verifiers: []
  tools:
    - kind: function
      id: review_tool
      displayName: review-tool
      description: Read review inputs.
    - kind: function
      id: security_tool
      displayName: security-tool
      description: Inspect security-sensitive changes.
  subagents:
    - id: style_reviewer
      displayName: style-reviewer
      instructions: Review style.
      tools:
        - review_tool
    - id: security_reviewer
      displayName: security-reviewer
      instructions: Flag secrets and unsafe writes.
      tools:
        - security_tool
  skills:
    - id: review_checklist
      displayName: review-checklist
      instructions: Apply the review checklist.
      allowedTools:
        - review_tool
  workflows:
    - kind: directed
      id: pr_review
      displayName: pr-review
      output: synthesize
      nodes:
        - type: agent_call
          id: fetch_diff
          label: fetch-diff
          prompt: Fetch the diff.
        - type: agent_call
          id: style_step
          label: style-reviewer
          prompt: Review style.
          dependsOn:
            - fetch_diff
          subagent: style_reviewer
        - type: agent_call
          id: security_step
          label: security-reviewer
          prompt: Review security.
          dependsOn:
            - fetch_diff
          subagent: security_reviewer
          tools:
            - security_tool
        - type: agent_call
          id: synthesize
          label: synthesize
          prompt: Synthesize the report.
          dependsOn:
            - style_step
            - security_step
  triggers:
    - kind: manual
      id: manual
      displayName: manual
    - kind: cron
      id: cron
      displayName: cron
      cron: 0 */2 * * *
      timezone: UTC
  routines:
    - kind: agent_tick
      id: agent_review_tick
      displayName: agent-review-tick
      charter: Review the worktree.
      prompt: Check the worktree for pending review work.
      target: runtime_agent
      triggers:
        - cron
      maxTurns: 8
      budget:
        maxTokens: 20000
    - kind: workflow_run
      id: pr_review_run
      displayName: pr-review-run
      target: pr_review
      triggers:
        - manual
      maxTurns: 12
      budget:
        maxTokens: 120000
  capabilities:
    permissions:
      mode: interactive
      rules:
        - kind: tool
          tool: "*"
          decision: deny
