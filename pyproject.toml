[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "linch"
version = "3.1.2"
description = "Production grade agentic harnessing SDK."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "CallMeZuy", email = "duyfaker01@gmail.com" }]
dependencies = [
  "jsonschema>=4,<5",
  "linch-native>=0.1,<0.2",
  "openai>=1.0.0",
  "opentelemetry-api>=1.20",
  "PyYAML>=6.0",
  "typing_extensions>=4.10",
]

[project.urls]
Homepage = "https://github.com/DuyTa506/linch"
Repository = "https://github.com/DuyTa506/linch"

[project.scripts]
linch = "linch.ext.scaffold:main"

[project.optional-dependencies]
# mcp 2.0 renamed the streamable-HTTP transport, moved headers onto a
# caller-supplied httpx client, and switched its models to snake_case.
# linch.mcp targets that API; 1.x is not supported.
mcp = [
  "mcp>=2.0.0",
]
anthropic = [
  "anthropic>=0.30.0",
]
gemini = [
  "google-genai>=1.39.0",
]
worker = ["pgqueuer[asyncpg]>=1.6,<1.7"]
postgres = [
  "asyncpg>=0.32",
]
dev = [
  "opentelemetry-sdk>=1.20",
  "psutil>=7.2.2",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  # Formatter output is version-sensitive by design (0.16 began formatting
  # Python inside Markdown), so pin it: an unpinned range turns CI red on a
  # ruff release rather than on a change of ours. Bump deliberately.
  "ruff>=0.15.16,<0.16",
  "pyright>=1.1",
]

[tool.hatch.build]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "docs/superpowers",
  "docs/ROADMAP.md",
  "examples/internals",
  "linch-rust",
  "**/.*",
]

[tool.hatch.build.targets.wheel]
only-include = [
  "src/linch",
  "docs/usage",
  "docs/architecture",
  "docs/architecture.md",
  "docs/usage.md",
  "docs/migration-3.0.md",
  "docs/versioning.md",
  "examples",
  "skills",
]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"docs" = "linch/_docs/docs"
"examples" = "linch/_docs/examples"
"skills" = "linch/_skills"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
# Follow-up: expand this gate to tests and examples after shipped src stays clean.
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false
